name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run test:unit

  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The RLS suite's Supabase realtime client needs Node >= 22 (see
      # README's Requirements section).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # `supabase start` boots Postgres/Auth/Storage/Realtime via Docker
      # (preinstalled on GitHub-hosted runners) and applies every migration
      # under supabase/migrations/ as part of bringing the stack up.
      - run: supabase start

      # tests/rls/setup.ts and the app's own Supabase clients read these
      # exact env var names; `supabase status -o json` is the only way to
      # get the local stack's generated anon/service-role keys at all, and
      # both a SUPABASE_* (server/test) and NEXT_PUBLIC_SUPABASE_* (app)
      # name are needed for the same two values.
      - name: Export Supabase env vars
        run: |
          status=$(supabase status -o json)
          {
            echo "SUPABASE_URL=$(echo "$status" | jq -r '.API_URL')"
            echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$status" | jq -r '.API_URL')"
            echo "SUPABASE_ANON_KEY=$(echo "$status" | jq -r '.ANON_KEY')"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$status" | jq -r '.ANON_KEY')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$status" | jq -r '.SERVICE_ROLE_KEY')"
          } >> "$GITHUB_ENV"

      - run: npm run test:rls

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No live Supabase connection needed at build time — next.config.ts
      # only branches on NODE_ENV, never a Supabase env var, and every page
      # that reads cookies()/auth is rendered dynamically at request time,
      # not during the build.
      - run: npm run build
